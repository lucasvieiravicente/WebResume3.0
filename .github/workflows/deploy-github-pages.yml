name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-user-site
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy token
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Secret PAGES_DEPLOY_TOKEN não encontrado."
            echo "Crie um PAT (classic com scope repo, ou fine-grained com Contents: Read and write no repo lucasvieiravicente.github.io)"
            echo "e adicione em WebResume3.0 → Settings → Secrets and variables → Actions → New repository secret"
            echo "Nome exato: PAGES_DEPLOY_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages
        run: npm run build:pages

      - name: Prepare SPA fallback
        run: |
          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Deploy to lucasvieiravicente.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: lucasvieiravicente/lucasvieiravicente.github.io
          publish_branch: master
          publish_dir: ./docs
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: update site from WebResume3.0'
